openapi: 3.1.0
info:
  title: TeslaMate API
  version: "v1+v2"
  description: |
    REST endpoints for [TeslaMate](https://github.com/adriankumpf/teslamate). The `/api/v1`
    routes mirror upstream [`tobiasehlert/teslamateapi`](https://github.com/tobiasehlert/teslamateapi)
    1:1; the `/api/v2` routes are additive in this fork — they expose data the
    iOS Tesla BLE companion needs (richer charge metadata, parking sessions,
    pre-aggregated stats) without disturbing v1 clients.

    Auth: when `API_TOKEN` is set, every endpoint outside `/api/ping`,
    `/api/healthz`, `/api/readyz`, and the OpenAPI surface (`/api/docs`,
    `/api/openapi.yaml`) requires `Authorization: Bearer <token>`.

servers:
  - url: http://localhost:8080
    description: Local dev (`dev/run-api.sh`)
  - url: /
    description: Same origin

security:
  - bearerAuth: []

tags:
  - name: system
    description: Health, ping, readiness — unauthenticated probes
  - name: v1
    description: Upstream-compatible endpoints (cars, charges, drives, commands, status, global settings)
  - name: v2
    description: Fork-only additions (parkings, lifetime / bucketed / per-geofence stats)

paths:
  # ─────────────────────────────────────────────────────────── meta ──
  /api/ping:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Pong
          content:
            application/json:
              schema:
                type: object
                properties: { message: { type: string, example: pong } }
  /api/healthz:
    get:
      tags: [system]
      summary: Kubernetes liveness probe
      security: []
      responses:
        "200": { description: OK }
  /api/readyz:
    get:
      tags: [system]
      summary: Kubernetes readiness probe (waits for MQTT)
      security: []
      responses:
        "200": { description: Ready }
        "503": { description: Not ready }
  /api/docs:
    get:
      tags: [system]
      summary: Scalar-rendered API reference (HTML)
      security: []
      responses:
        "200":
          description: HTML page
          content:
            text/html: {}
  /api/openapi.yaml:
    get:
      tags: [system]
      summary: Raw OpenAPI 3.1 spec
      security: []
      responses:
        "200":
          description: This document
          content:
            application/yaml: {}

  # ─────────────────────────────────────────────────────────── v1 ──
  /api/v1/cars:
    get:
      tags: [v1]
      summary: List all cars
      responses:
        "200":
          description: Cars
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V1CarsResponse" }
  /api/v1/cars/{CarID}:
    get:
      tags: [v1]
      summary: Single car details
      parameters: [{ $ref: "#/components/parameters/CarID" }]
      responses: { "200": { description: Car details } }
  /api/v1/cars/{CarID}/battery-health:
    get:
      tags: [v1]
      summary: Battery health timeline
      parameters: [{ $ref: "#/components/parameters/CarID" }]
      responses: { "200": { description: Battery health } }
  /api/v1/cars/{CarID}/charges:
    get:
      tags: [v1]
      summary: Charge sessions (paged) with derived charge_type / cable / phase / brand
      description: |
        Returns one row per charging session. Beyond the original v1 fields,
        rows include per-session aggregates from the `charges` time-series table:

        - `fast_charger_present` — any DC sample observed
        - `fast_charger_brand` / `fast_charger_type` — first non-null brand / type
        - `peak_charger_power` / `peak_charger_voltage` — max during session
        - `charger_phases` — first non-null phase count (1/2/3); `null` for DC
        - `conn_charge_cable` — first non-null cable string. TeslaMate writes
          `"<invalid>"` for DC and pre-handshake samples; we preserve it.
        - `pilot_current_max` — peak J1772/IEC pilot current advertised
        - `charge_type` — derived `dc` / `ac` / `unknown`. Priority:
          fast_charger_present → DC; phases ∈ {1,2,3} → AC; cable in
          IEC/SAE/GB/GB_AC → AC; cable GB_DC → DC; otherwise unknown.
        - `is_tesla_charger` — derived `fast_charger_brand == "Tesla"`
      parameters:
        - { $ref: "#/components/parameters/CarID" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Show" }
        - { $ref: "#/components/parameters/StartDate" }
        - { $ref: "#/components/parameters/EndDate" }
      responses:
        "200":
          description: Charges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V1ChargesResponse" }
  /api/v1/cars/{CarID}/charges/current:
    get:
      tags: [v1]
      summary: In-progress charge session, or 204 if none
      parameters: [{ $ref: "#/components/parameters/CarID" }]
      responses:
        "200": { description: Active charge }
        "204": { description: Not currently charging }
  /api/v1/cars/{CarID}/charges/{ChargeID}:
    get:
      tags: [v1]
      summary: Charge session detail (with time-series points)
      parameters:
        - { $ref: "#/components/parameters/CarID" }
        - in: path
          name: ChargeID
          required: true
          schema: { type: integer }
      responses: { "200": { description: Charge detail } }
  /api/v1/cars/{CarID}/command:
    get:
      tags: [v1]
      summary: List allowed commands
      parameters: [{ $ref: "#/components/parameters/CarID" }]
      responses: { "200": { description: Command list } }
  /api/v1/cars/{CarID}/command/{Command}:
    post:
      tags: [v1]
      summary: Send a command (proxied to Tesla owners API)
      parameters:
        - { $ref: "#/components/parameters/CarID" }
        - in: path
          name: Command
          required: true
          schema: { type: string }
      responses:
        "200": { description: Command accepted }
        "401": { description: Bearer token required / invalid }
        "405": { description: Command not in allow-list }
  /api/v1/cars/{CarID}/wake_up:
    post:
      tags: [v1]
      summary: Wake the car
      parameters: [{ $ref: "#/components/parameters/CarID" }]
      responses: { "200": { description: Wake request sent } }
  /api/v1/cars/{CarID}/drives:
    get:
      tags: [v1]
      summary: Drive sessions (paged)
      parameters:
        - { $ref: "#/components/parameters/CarID" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Show" }
        - { $ref: "#/components/parameters/StartDate" }
        - { $ref: "#/components/parameters/EndDate" }
      responses: { "200": { description: Drives } }
  /api/v1/cars/{CarID}/drives/{DriveID}:
    get:
      tags: [v1]
      summary: Drive detail (with route points)
      parameters:
        - { $ref: "#/components/parameters/CarID" }
        - in: path
          name: DriveID
          required: true
          schema: { type: integer }
      responses: { "200": { description: Drive detail } }
  /api/v1/cars/{CarID}/logging:
    get:
      tags: [v1]
      summary: List allowed logging commands (requires ENABLE_COMMANDS)
      parameters: [{ $ref: "#/components/parameters/CarID" }]
      responses:
        "200": { description: Allowed commands }
        "403": { description: ENABLE_COMMANDS is not set }
  /api/v1/cars/{CarID}/logging/{Command}:
    put:
      tags: [v1]
      summary: Toggle TeslaMate logging for a car (resume / suspend)
      description: |
        Proxies a PUT to TeslaMate's `/api/car/{CarID}/logging/{Command}`.
        Allowed values for `Command` are `resume` and `suspend`. Requires
        `ENABLE_COMMANDS=true` and a valid bearer token.
      parameters:
        - { $ref: "#/components/parameters/CarID" }
        - in: path
          name: Command
          required: true
          schema:
            type: string
            enum: [resume, suspend]
      responses:
        "200": { description: TeslaMate accepted the request }
        "401": { description: Bearer token required / invalid, or command not in allow-list }
        "403": { description: ENABLE_COMMANDS is not set }
  /api/v1/cars/{CarID}/status:
    get:
      tags: [v1]
      summary: Current MQTT-backed status snapshot
      parameters: [{ $ref: "#/components/parameters/CarID" }]
      responses: { "200": { description: Status }, "503": { description: MQTT disabled } }
  /api/v1/cars/{CarID}/updates:
    get:
      tags: [v1]
      summary: Software-update history
      parameters: [{ $ref: "#/components/parameters/CarID" }]
      responses: { "200": { description: Updates } }
  /api/v1/globalsettings:
    get:
      tags: [v1]
      summary: TeslaMate global settings (units, language, base URLs)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V1GlobalSettingsResponse" }

  # ─────────────────────────────────────────────────────── v2 parkings ──
  /api/v2/cars/{CarID}/parkings:
    get:
      tags: [v2]
      summary: Parking sessions (gaps between drives)
      description: |
        TeslaMate stores no parking table; sessions are derived as the time
        between consecutive `drives.end_date` and the next `drives.start_date`.
        Active (open-ended) sessions return `end_date: null`. The session is
        keyed by `preceding_drive_id` — the drive whose end starts the parking.
      parameters:
        - { $ref: "#/components/parameters/CarID" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Show" }
        - { $ref: "#/components/parameters/V2StartDate" }
        - { $ref: "#/components/parameters/V2EndDate" }
        - { $ref: "#/components/parameters/V2MinDuration" }
      responses:
        "200":
          description: Parking list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2ParkingsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v2/cars/{CarID}/parkings/{PrecedingDriveID}:
    get:
      tags: [v2]
      summary: Parking detail with sampled environment points
      description: |
        `PrecedingDriveID` is the upstream `drives.id` of the drive that ends
        (and so starts the parking after) the session. Returns sampled
        `positions` rows during the parking window (battery / temp / usable
        level) for vampire-drain analysis.
      parameters:
        - { $ref: "#/components/parameters/CarID" }
        - in: path
          name: PrecedingDriveID
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Parking with sampled points
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2ParkingDetailResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }

  # ───────────────────────────────────────────────────────── v2 stats ──
  /api/v2/cars/{CarID}/stats/lifetime:
    get:
      tags: [v2]
      summary: Lifetime totals (drives + charges + parkings)
      parameters: [{ $ref: "#/components/parameters/CarID" }]
      responses:
        "200":
          description: Lifetime aggregates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2LifetimeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v2/cars/{CarID}/stats/summary:
    get:
      tags: [v2]
      summary: Time-bucketed activity summary
      description: |
        Aggregate drives / charges / parkings into time buckets. `period`
        controls the bucket size (`day`, `week`, `month`, `year`). Optional
        `start_date` / `end_date` clip the window.
      parameters:
        - { $ref: "#/components/parameters/CarID" }
        - in: query
          name: period
          schema:
            type: string
            enum: [day, week, month, year]
            default: month
        - { $ref: "#/components/parameters/V2StartDate" }
        - { $ref: "#/components/parameters/V2EndDate" }
      responses:
        "200":
          description: Bucketed summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2SummaryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v2/cars/{CarID}/stats/by-geofence:
    get:
      tags: [v2]
      summary: Per-geofence activity totals
      parameters:
        - { $ref: "#/components/parameters/CarID" }
        - { $ref: "#/components/parameters/V2StartDate" }
        - { $ref: "#/components/parameters/V2EndDate" }
      responses:
        "200":
          description: Geofence totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2ByGeofenceResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    CarID:
      in: path
      name: CarID
      required: true
      schema: { type: integer, minimum: 1 }
      description: TeslaMate `cars.id`
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Show:
      in: query
      name: show
      schema: { type: integer, minimum: 1, maximum: 10000, default: 100 }
    StartDate:
      in: query
      name: startDate
      schema: { type: string, format: date-time }
      description: ISO-8601 inclusive lower bound (UTC or with offset)
    EndDate:
      in: query
      name: endDate
      schema: { type: string, format: date-time }
      description: ISO-8601 inclusive upper bound
    V2StartDate:
      in: query
      name: start_date
      schema: { type: string, format: date-time }
      description: ISO-8601 inclusive lower bound (UTC or with offset). v2 uses snake_case.
    V2EndDate:
      in: query
      name: end_date
      schema: { type: string, format: date-time }
      description: ISO-8601 inclusive upper bound. v2 uses snake_case.
    V2MinDuration:
      in: query
      name: min_duration
      schema: { type: integer, minimum: 0 }
      description: Drop sessions shorter than N minutes (v2 parkings list).

  responses:
    BadRequest:
      description: Invalid path or query parameter
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Bearer token missing or invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalServerError:
      description: Database or internal failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    NullableString:
      oneOf: [{ type: string }, { type: "null" }]
    NullableInt:
      oneOf: [{ type: integer }, { type: "null" }]
    NullableFloat:
      oneOf: [{ type: number }, { type: "null" }]

    Error:
      type: object
      properties:
        error: { type: string }
      required: [error]

    Pagination:
      type: object
      description: |
        Echoes the page/show the request asked for, plus the total matching
        rows and a precomputed has_next so clients can stop paging without
        making a probe request.
      properties:
        page:        { type: integer, minimum: 1 }
        show:        { type: integer, minimum: 1 }
        total_count: { type: integer, minimum: 0 }
        has_next:    { type: boolean }
      required: [page, show, total_count, has_next]

    Car:
      type: object
      properties:
        car_id:   { type: integer }
        car_name: { $ref: "#/components/schemas/NullableString" }
      required: [car_id]

    Units:
      type: object
      properties:
        unit_of_length:      { type: string, enum: [km, mi] }
        unit_of_temperature: { type: string, enum: [C, F] }
      required: [unit_of_length, unit_of_temperature]

    BatteryDetails:
      type: object
      properties:
        start_battery_level: { type: integer }
        end_battery_level:   { type: integer }

    PreferredRange:
      type: object
      properties:
        start_range: { type: number }
        end_range:   { type: number }

    # ── v1 surface (lightweight; upstream is the source of truth) ─────
    V1CarsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            cars:
              type: array
              items: { type: object, additionalProperties: true }

    V1GlobalSettingsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            setting_id: { type: integer }
            teslamate_units: { $ref: "#/components/schemas/Units" }
          additionalProperties: true

    # ── v1 charges ───────────────────────────────────────────────────
    V1Charge:
      type: object
      properties:
        charge_id:            { type: integer }
        start_date:           { type: string, format: date-time }
        end_date:             { type: string, format: date-time }
        address:              { type: string }
        charge_energy_added:  { type: number, description: kWh }
        charge_energy_used:   { type: number, description: kWh }
        cost:                 { type: number }
        duration_min:         { type: integer }
        duration_str:         { type: string, example: "00:30" }
        battery_details:      { $ref: "#/components/schemas/BatteryDetails" }
        range_ideal:          { $ref: "#/components/schemas/PreferredRange" }
        range_rated:          { $ref: "#/components/schemas/PreferredRange" }
        outside_temp_avg:     { type: number }
        odometer:             { type: number }
        latitude:             { type: number }
        longitude:            { type: number }
        fast_charger_present: { type: boolean }
        fast_charger_brand:   { $ref: "#/components/schemas/NullableString" }
        fast_charger_type:    { $ref: "#/components/schemas/NullableString" }
        peak_charger_power:   { type: integer, description: kW }
        peak_charger_voltage: { type: integer, description: V }
        charger_phases:
          $ref: "#/components/schemas/NullableInt"
          description: "First non-null phase count 1/2/3; null on DC sessions"
        conn_charge_cable:
          $ref: "#/components/schemas/NullableString"
          description: 'IEC / SAE / GB / GB_AC / GB_DC / "<invalid>" (TeslaMate marker for DC and pre-handshake)'
        pilot_current_max:
          $ref: "#/components/schemas/NullableInt"
          description: Peak advertised pilot current (A)
        charge_type:
          type: string
          enum: [dc, ac, unknown]
          description: Derived; see endpoint description for rules
        is_tesla_charger:
          type: boolean
          description: 'Derived: fast_charger_brand == "Tesla"'
      required:
        - charge_id
        - start_date
        - end_date
        - charge_type
        - is_tesla_charger

    V1ChargesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            car:     { $ref: "#/components/schemas/Car" }
            charges:
              type: array
              items: { $ref: "#/components/schemas/V1Charge" }
            units:   { $ref: "#/components/schemas/Units" }

    # ── v2 parkings ──────────────────────────────────────────────────
    V2ParkingBase:
      type: object
      description: |
        Parking session shape used by the list endpoint. `outside_temp_avg`
        is intentionally absent here — computing it requires a per-row scan
        over the positions table (millions of rows / car) which makes the
        list query unusable. Use the detail endpoint when you need it.
      properties:
        parking_id:          { type: integer, description: "Drive id that ends the session" }
        start_date:          { type: string, format: date-time }
        end_date:            { $ref: "#/components/schemas/NullableString" }
        duration_min:        { type: integer }
        duration_str:        { type: string }
        address:             { $ref: "#/components/schemas/NullableString" }
        geofence_id:         { $ref: "#/components/schemas/NullableInt" }
        latitude:            { $ref: "#/components/schemas/NullableFloat" }
        longitude:           { $ref: "#/components/schemas/NullableFloat" }
        start_battery_level: { $ref: "#/components/schemas/NullableInt" }
        end_battery_level:   { $ref: "#/components/schemas/NullableInt" }
        usable_battery_drop: { type: integer }
        energy_consumed_kwh: { $ref: "#/components/schemas/NullableFloat" }
        had_charging:        { type: boolean }

    V2ParkingsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            car:      { $ref: "#/components/schemas/Car" }
            parkings:
              type: array
              items: { $ref: "#/components/schemas/V2ParkingBase" }
            units:    { $ref: "#/components/schemas/Units" }

    V2ParkingPoint:
      type: object
      properties:
        date:                 { type: string, format: date-time }
        battery_level:        { $ref: "#/components/schemas/NullableInt" }
        usable_battery_level: { $ref: "#/components/schemas/NullableInt" }
        outside_temp:         { $ref: "#/components/schemas/NullableFloat" }

    V2ParkingDetailResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            car: { $ref: "#/components/schemas/Car" }
            parking:
              allOf:
                - { $ref: "#/components/schemas/V2ParkingBase" }
                - type: object
                  properties:
                    outside_temp_avg: { $ref: "#/components/schemas/NullableFloat" }
                    parking_details:
                      type: array
                      items: { $ref: "#/components/schemas/V2ParkingPoint" }
            units: { $ref: "#/components/schemas/Units" }

    # ── v2 stats ─────────────────────────────────────────────────────
    V2DrivesAgg:
      type: object
      properties:
        count:                     { type: integer }
        total_distance:            { type: number }
        total_duration_min:        { type: integer }
        total_energy_consumed_kwh: { type: number }
        avg_consumption:           { type: number, description: "Wh per km|mi" }
        best_consumption:          { type: number }
        longest_distance:          { type: number }
        max_speed:                 { type: integer }

    V2ChargesAgg:
      type: object
      properties:
        count:                  { type: integer }
        total_energy_added_kwh: { type: number }
        total_energy_used_kwh:  { type: number }
        total_cost:             { type: number }
        fast_charge_count:      { type: integer }
        fast_charge_energy_kwh: { type: number }
        peak_power_max_kw:      { type: integer }

    V2ParkingsAgg:
      type: object
      properties:
        count:                   { type: integer }
        total_duration_min:      { type: integer }
        total_vampire_drain_kwh: { type: number }

    V2LifetimeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            car:      { $ref: "#/components/schemas/Car" }
            since:    { $ref: "#/components/schemas/NullableString" }
            drives:   { $ref: "#/components/schemas/V2DrivesAgg" }
            charges:  { $ref: "#/components/schemas/V2ChargesAgg" }
            parkings: { $ref: "#/components/schemas/V2ParkingsAgg" }
            units:    { $ref: "#/components/schemas/Units" }

    V2SummaryBucket:
      type: object
      properties:
        bucket_start:                { type: string, format: date-time }
        bucket_end:                  { type: string, format: date-time }
        drives_count:                { type: integer }
        drives_distance:             { type: number }
        drives_duration_min:         { type: integer }
        drives_energy_consumed_kwh:  { type: number }
        drives_avg_consumption:      { type: number }
        charges_count:               { type: integer }
        charges_energy_added_kwh:    { type: number }
        charges_cost:                { type: number }
        fast_charge_ratio:           { type: number, description: "0..1, by energy" }
        parkings_total_duration_min: { type: integer }
        vampire_drain_kwh:           { type: number }

    V2SummaryResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            car:     { $ref: "#/components/schemas/Car" }
            period:  { type: string, enum: [day, week, month, year] }
            buckets:
              type: array
              items: { $ref: "#/components/schemas/V2SummaryBucket" }
            units:   { $ref: "#/components/schemas/Units" }

    V2GeofenceRow:
      type: object
      properties:
