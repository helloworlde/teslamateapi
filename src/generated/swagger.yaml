info:
  contact: {}
  description: TeslaMate 数据查询与分析 API。提供 V1（原始数据）和 V2（聚合分析）两套接口。
  title: TeslaMateApi
  version: "2.0"
paths:
  /:
    get:
      description: 返回服务运行状态与 API 基础路径，用于快速联通性检查。
      produces:
      - application/json
      responses:
        "200":
          description: 服务运行中
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 服务根路径
      tags:
      - system
  /api:
    get:
      description: 返回服务运行状态与 /api 基础路径。
      produces:
      - application/json
      responses:
        "200":
          description: 服务运行中
          schema:
            additionalProperties:
              type: string
            type: object
      summary: /api 根路径
      tags:
      - system
  /docs:
    get:
      description: 将 /api/docs 与 /api/docs/ 永久重定向到 Scalar 渲染页。
      produces:
      - application/json
      responses:
        "301":
          description: 已重定向
          schema:
            type: string
      summary: 文档跳转
      tags:
      - system
  /docs/assets/{filepath}:
    get:
      description: 返回 Scalar 渲染所需的静态资源（JS、字体等）。
      parameters:
      - description: 资源相对路径
        in: path
        name: filepath
        required: true
        type: string
      produces:
      - application/javascript
      - font/woff2
      - application/octet-stream
      responses:
        "200":
          description: 资源二进制流
          schema:
            type: file
        "400":
          description: 路径无效
          schema:
            $ref: '#/definitions/APIErrorResponse'
        "404":
          description: 资源不存在
          schema:
            $ref: '#/definitions/APIErrorResponse'
      summary: 文档静态资源
      tags:
      - system
  /docs/swagger.json:
    get:
      description: 返回内嵌的 Swagger 2.0 JSON 规范，可直接被 Scalar/Swagger UI 加载。
      produces:
      - application/json
      responses:
        "200":
          description: Swagger JSON 规范
          schema:
            type: object
      summary: OpenAPI 规范
      tags:
      - system
  /healthz:
    get:
      description: Kubernetes liveness 探针，进程存活则返回 200。
      produces:
      - application/json
      responses:
        "200":
          description: 服务存活
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 存活探针
      tags:
      - system
  /ping:
    get:
      description: 简单的 ping/pong 探活接口，用于网络层连通性检测。
      produces:
      - application/json
      responses:
        "200":
          description: pong
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ping 探活
      tags:
      - system
  /readyz:
    get:
      description: Kubernetes readiness 探针，数据库连接建立后返回 200，否则 503。
      produces:
      - application/json
      responses:
        "200":
          description: 服务就绪
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: 尚未就绪
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 就绪探针
      tags:
      - system
  /v1:
    get:
      description: 返回 V1 接口运行状态与基础路径。
      produces:
      - application/json
      responses:
        "200":
          description: V1 接口运行中
          schema:
            additionalProperties:
