basePath: /api
definitions:
  APIErrorBody:
    properties:
      code:
        type: string
      details:
        type: object
      message:
        type: string
    type: object
  APIErrorResponse:
    properties:
      error:
        $ref: '#/definitions/APIErrorBody'
    type: object
  V1ErrorEnvelope:
    properties:
      error:
        type: string
    type: object
  V1JSONEnvelope:
    properties:
      data: {}
    type: object
  V2BatteryAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2BatteryResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2BatteryRange:
    properties:
      ideal:
        type: number
      rated:
        type: number
    type: object
  V2BatteryResponse:
    properties:
      summary:
        $ref: '#/definitions/V2BatterySummary'
    type: object
  V2BatterySummary:
    properties:
      baseline_range_at_full_charge:
        $ref: '#/definitions/V2BatteryRange'
      estimated_range_degradation:
        type: number
      latest_ideal_range:
        type: number
      latest_level:
        type: integer
      latest_rated_range:
        type: number
      range_at_full_charge:
        $ref: '#/definitions/V2BatteryRange'
    type: object
  V2BatteryTimeseriesAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2BatteryTimeseriesResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2BatteryTimeseriesItem:
    properties:
      avg_level:
        type: number
      period_start:
        type: string
      range_at_full_charge:
        $ref: '#/definitions/V2BatteryRange'
    type: object
  V2BatteryTimeseriesResponse:
    properties:
      group_by:
        type: string
      items:
        items:
          $ref: '#/definitions/V2BatteryTimeseriesItem'
        type: array
    type: object
  V2CapabilitiesAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2CapabilitiesResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2CapabilitiesDomain:
    properties:
      name:
        example: driving
        type: string
      path:
        example: /v2/cars/{car_id}/analytics/driving
        type: string
      supports_breakdown:
        type: boolean
      supports_compare:
        type: boolean
      supports_timeseries:
        type: boolean
    type: object
  V2CapabilitiesResponse:
    properties:
      breakdown_options:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      domains:
        items:
          $ref: '#/definitions/V2CapabilitiesDomain'
        type: array
      version:
        example: v2
        type: string
    type: object
  V2ChargingAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2ChargingResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2ChargingBreakdownResponse:
    properties:
      by:
        type: string
      locations:
        items:
          $ref: '#/definitions/V2ChargingLocationItem'
        type: array
      types:
        items:
          $ref: '#/definitions/V2ChargingTypeItem'
        type: array
    type: object
  V2ChargingLocationItem:
    properties:
      address_id:
        type: integer
      charging_efficiency:
        type: number
      cost:
        type: number
      energy_added:
        type: number
      energy_used:
        type: number
      geofence_id:
        type: integer
      location_name:
        type: string
      session_count:
        type: integer
    type: object
  V2ChargingResponse:
    properties:
      breakdown:
        $ref: '#/definitions/V2ChargingBreakdownResponse'
      summary:
        $ref: '#/definitions/V2ChargingSummary'
      timeseries:
        $ref: '#/definitions/V2ChargingTimeseriesResponse'
    type: object
  V2ChargingSummary:
    properties:
      ac_energy:
        type: number
      ac_session_count:
        type: integer
      avg_cost:
        type: number
      avg_cost_per_energy:
        type: number
      avg_duration:
        type: number
      avg_energy_added:
        type: number
      avg_power:
        type: number
      charging_efficiency:
        type: number
      cost:
        type: number
      dc_energy:
        type: number
      dc_session_count:
        type: integer
      duration:
        type: number
      end_battery_avg:
        type: number
      energy_added:
        type: number
      energy_used:
        type: number
      largest_session:
        type: number
      longest_session_duration:
        type: number
      max_cost:
        type: number
      max_power:
        type: number
      session_count:
        type: integer
      start_battery_avg:
        type: number
    type: object
  V2ChargingTimeseriesItem:
    properties:
      avg_power:
        type: number
      cost:
        type: number
      duration:
        type: number
      energy_added:
        type: number
      energy_used:
        type: number
      period_start:
        type: string
      session_count:
        type: integer
    type: object
  V2ChargingTimeseriesResponse:
    properties:
      group_by:
        type: string
      items:
        items:
          $ref: '#/definitions/V2ChargingTimeseriesItem'
        type: array
    type: object
  V2ChargingTypeItem:
    properties:
      charging_type:
        type: string
      cost:
        type: number
      energy_added:
        type: number
      energy_used:
        type: number
      session_count:
        type: integer
    type: object
  V2ComparisonValue:
    properties:
      current:
        type: number
      delta:
        type: number
      delta_percent:
        type: number
      previous:
        type: number
    type: object
  V2CostAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2CostResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2CostLocationItem:
    properties:
      charging_cost:
        type: number
      energy_used:
        type: number
      location_name:
        type: string
    type: object
  V2CostPeriodItem:
    properties:
      charging_cost:
        type: number
      energy_used:
        type: number
      period_start:
        type: string
    type: object
  V2CostResponse:
    properties:
      cost_by_location:
        items:
          $ref: '#/definitions/V2CostLocationItem'
        type: array
      cost_by_period:
        items:
          $ref: '#/definitions/V2CostPeriodItem'
        type: array
      summary:
        $ref: '#/definitions/V2CostSummaryDetails'
    type: object
  V2CostSummary:
    properties:
      charging_cost:
        type: number
      cost_per_distance:
        type: number
    type: object
  V2CostSummaryDetails:
    properties:
      charging_cost:
        type: number
      cost_per_distance:
        type: number
      cost_per_energy:
        type: number
      distance:
        type: number
      energy_used:
        type: number
    type: object
  V2DrivingAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2DrivingResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2DrivingResponse:
    properties:
      summary:
        $ref: '#/definitions/V2DrivingSummary'
    type: object
  V2DrivingSummary:
    properties:
      avg_consumption:
        type: number
      avg_distance:
        type: number
      avg_duration:
        type: number
      avg_outside_temp:
        type: number
      avg_speed:
        type: number
      battery_level_used:
        type: number
      best_consumption:
        type: number
      distance:
        type: number
      drive_count:
        type: integer
      duration:
        type: number
      estimated_energy_consumed:
        type: number
      estimated_energy_regen:
        type: number
      longest_drive_duration:
        type: number
      max_speed:
        type: number
      net_energy:
        type: number
      peak_drive_power:
        type: number
      peak_regen_power:
        type: number
      range_loss:
        type: number
      worst_consumption:
        type: number
    type: object
  V2DrivingTimeseriesAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2DrivingTimeseriesResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2DrivingTimeseriesItem:
    properties:
      avg_consumption:
        type: number
      avg_speed:
        type: number
      distance:
        type: number
      drive_count:
        type: integer
      duration:
        type: number
      estimated_energy_consumed:
        type: number
      period_start:
        type: string
    type: object
  V2DrivingTimeseriesResponse:
    properties:
      group_by:
        type: string
      items:
        items:
          $ref: '#/definitions/V2DrivingTimeseriesItem'
        type: array
    type: object
  V2LifecycleAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2LifecycleResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2LifecycleResponse:
    properties:
      as_of:
        type: string
      avg_consumption:
        type: number
      avg_daily_distance:
        type: number
      avg_monthly_distance:
        type: number
      charging_cost:
        type: number
      charging_session_count:
        type: integer
      cost_per_distance:
        type: number
      distance:
        type: number
      drive_count:
        type: integer
      energy_added:
        type: number
      energy_used:
        type: number
      first_recorded_at:
        type: string
      last_recorded_at:
        type: string
      recorded_days:
        type: integer
      update_count:
        type: integer
    type: object
  V2Meta:
    properties:
      car_id:
        example: 1
        type: integer
      compare:
        enum:
        - none
        - previous_period
        type: string
      end:
        format: date-time
        type: string
      generated_at:
        format: date-time
        type: string
      period:
        enum:
        - day
        - week
        - month
        - quarter
        - year
        - custom
        - lifetime
        type: string
      start:
        format: date-time
        type: string
      timezone:
        example: Asia/Shanghai
        type: string
      unit:
        $ref: '#/definitions/V2Unit'
    type: object
  V2ParkingAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2ParkingResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2ParkingBreakdownResponse:
    properties:
      by:
        type: string
      locations:
        items:
          $ref: '#/definitions/V2ParkingLocationItem'
        type: array
      states:
        items:
          $ref: '#/definitions/V2ParkingStateItem'
        type: array
    type: object
  V2ParkingLocationItem:
    properties:
      address_id:
        type: integer
      avg_parked_duration:
        type: number
      geofence_id:
        type: integer
      location_name:
        type: string
      parked_duration:
        type: number
      parking_session_count:
        type: integer
    type: object
  V2ParkingResponse:
    properties:
      breakdown:
        $ref: '#/definitions/V2ParkingBreakdownResponse'
      summary:
        $ref: '#/definitions/V2ParkingSummary'
    type: object
  V2ParkingStateItem:
    properties:
      duration:
        type: number
      percent:
        type: number
      state:
        type: string
      transition_count:
        type: integer
    type: object
  V2ParkingSummary:
    properties:
      asleep_duration:
        type: number
      avg_drain_percent_per_day:
        type: number
      avg_parked_duration:
        type: number
      estimated_vampire_drain:
        type: number
      offline_duration:
        type: number
      online_duration:
        type: number
      parked_duration:
        type: number
      parking_session_count:
        type: integer
      state_transition_count:
        type: integer
      vampire_drain_percent:
        type: number
    type: object
  V2Summary:
    properties:
      battery:
        $ref: '#/definitions/V2BatterySummary'
      charging:
        $ref: '#/definitions/V2ChargingSummary'
      cost:
        $ref: '#/definitions/V2CostSummary'
      driving:
        $ref: '#/definitions/V2DrivingSummary'
      parking:
        $ref: '#/definitions/V2ParkingSummary'
      updates:
        $ref: '#/definitions/V2UpdateSummary'
      vehicle:
        $ref: '#/definitions/V2VehicleSummary'
    type: object
  V2SummaryAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2SummaryResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2SummaryResponse:
    properties:
      comparison:
        additionalProperties:
          $ref: '#/definitions/V2ComparisonValue'
        description: 'Comparison keys: driving/charging/parking/battery/updates/vehicle/cost
          field paths; values are current vs previous period.'
        type: object
      summary:
        $ref: '#/definitions/V2Summary'
    type: object
  V2TimelineAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2TimelineResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2TimelineEvent:
    properties:
      end_time:
        type: string
      id:
        type: integer
      metrics:
        additionalProperties: true
        type: object
      start_time:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  V2TimelineResponse:
    properties:
      events:
        items:
          $ref: '#/definitions/V2TimelineEvent'
        type: array
      has_more:
        type: boolean
      next_cursor:
        type: string
      total:
        type: integer
    type: object
  V2Unit:
    properties:
      consumption:
        example: Wh/km
        type: string
      currency:
        example: CNY
        type: string
      distance:
        example: km
        type: string
      duration:
        example: seconds
        type: string
      elevation:
        example: m
        type: string
      energy:
        example: kWh
        type: string
      power:
        example: kW
        type: string
      speed:
        example: km/h
        type: string
      temperature:
        example: C
        type: string
    type: object
  V2UpdateAnalyticsAPIResponse:
    properties:
      data:
        $ref: '#/definitions/V2UpdateAnalyticsResponse'
      meta:
        $ref: '#/definitions/V2Meta'
    type: object
  V2UpdateAnalyticsResponse:
    properties:
      avg_update_duration:
        type: number
      latest_updated_at:
        type: string
      latest_version:
        type: string
      update_count:
        type: integer
      versions:
        items:
          $ref: '#/definitions/V2UpdateVersion'
        type: array
    type: object
  V2UpdateChargingMetrics:
    properties:
      battery_energy:
        type: number
      cost:
        type: number
      duration:
        type: number
      efficiency:
        type: number
      session_count:
        type: integer
      wall_energy:
        type: number
    type: object
  V2UpdateDrivingMetrics:
    properties:
      avg_consumption:
        type: number
      distance:
        type: number
      duration:
        type: number
      net_energy:
        type: number
      trip_count:
        type: integer
    type: object
  V2UpdateEvent:
    properties:
      completed_at:
        type: string
      days_since_prior:
        type: integer
      duration:
        type: number
      started_at:
        type: string
      version:
        type: string
    type: object
  V2UpdateSummary:
    properties:
      latest_version:
        type: string
      update_count:
        type: integer
    type: object
  V2UpdateVersion:
    properties:
      event:
        $ref: '#/definitions/V2UpdateEvent'
      metrics:
        $ref: '#/definitions/V2UpdateWindowMetrics'
      window:
        $ref: '#/definitions/V2UpdateWindow'
    type: object
  V2UpdateWindow:
    properties:
      end:
        type: string
      interval:
        type: number
      start:
        type: string
    type: object
  V2UpdateWindowMetrics:
    properties:
      charging:
        $ref: '#/definitions/V2UpdateChargingMetrics'
      driving:
        $ref: '#/definitions/V2UpdateDrivingMetrics'
      inactive_duration:
        type: number
    type: object
  V2VehicleSummary:
    properties:
      odometer:
        type: number
      tracked_charges:
        type: integer
      tracked_distance:
        type: number
      tracked_drives:
        type: integer
    type: object
info:
  contact: {}
  description: REST API for TeslaMate data, including V1 resources and V2 objective
    analytics.
  title: TeslaMateApi
  version: "2.0"
paths:
  /v1/cars:
    get:
      description: Returns cars registered in TeslaMate. Omit CarID to list all cars;
        include CarID for a single car.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: List TeslaMate cars or get one car
      tags:
      - V1
  /v1/cars/{CarID}:
    get:
      description: Returns cars registered in TeslaMate. Omit CarID to list all cars;
        include CarID for a single car.
      parameters:
      - description: Car ID (omit for list)
        in: path
        name: CarID
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: List TeslaMate cars or get one car
      tags:
      - V1
  /v1/cars/{CarID}/battery-health:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Get battery health for one car
      tags:
      - V1
  /v1/cars/{CarID}/charges:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Result page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 100)
        in: query
        name: show
        type: integer
      - description: Filter start date
        in: query
        name: startDate
        type: string
      - description: Filter end date
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: List charging sessions for one car
      tags:
      - V1
  /v1/cars/{CarID}/charges/{ChargeID}:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Charge ID
        in: path
        name: ChargeID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Get one charging session by ID
      tags:
      - V1
  /v1/cars/{CarID}/charges/current:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Get active charging session if any
      tags:
      - V1
  /v1/cars/{CarID}/drives:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Result page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: show
        type: integer
      - description: Filter start date
        in: query
        name: startDate
        type: string
      - description: Filter end date
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: List drives for one car
      tags:
      - V1
  /v1/cars/{CarID}/drives/{DriveID}:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Drive ID
        in: path
        name: DriveID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Get one drive by ID
      tags:
      - V1
  /v1/cars/{CarID}/updates:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: List firmware updates for one car
      tags:
      - V1
  /v1/globalsettings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Get TeslaMate global settings
      tags:
      - V1
  /v2/capabilities:
    get:
      description: Returns the V2 analytics API version, the per-domain feature flags
        (compare/timeseries/breakdown), and the allowed breakdown values per do
        Clients use this to decide which query parameters to send instead of probing
        each endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V2CapabilitiesAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/APIErrorResponse'
      summary: V2 API capabilities
      tags:
      - V2 Summary
  /v2/cars/{CarID}/analytics/battery:
    get:
      description: Returns objective latest battery range samples, estimated full-range
        values, baseline range, and estimated range degradation. These estimates are
        not official state of health.
      parameters:
      - description: Car ID
        example: 1
        in: path
        name: CarID
        required: true
        type: integer
      - description: Aggregation period
        enum:
        - day
        - week
        - month
        - quarter
        - year
        - custom
        in: query
        name: period
        type: string
      - description: Start datetime in RFC3339 format
        in: query
        name: start
        type: string
      - description: End datetime in RFC3339 format
        in: query
        name: end
        type: string
      - description: IANA timezone
        in: query
        name: timezone
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V2BatteryAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/APIErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/APIErrorResponse'
      summary: V2 battery analytics summary
      tags:
      - V2 Battery Analytics
  /v2/cars/{CarID}/analytics/battery/timeseries:
    get:
      description: Returns estimated full rated and ideal range grouped by day, week,
        month, or year for trend charts.
      parameters:
      - description: Car ID
        example: 1
        in: path
        name: CarID
        required: true
        type: integer
      - description: Aggregation period
        enum:
        - day
        - week
        - month
        - quarter
        - year
        - custom
        in: query
        name: period
        type: string
      - description: Start datetime in RFC3339 format
        in: query
        name: start
        type: string
