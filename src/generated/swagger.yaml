info:
  contact: {}
  description: REST API for TeslaMate data, including V1 resources and V2 objective
    analytics.
  title: TeslaMateApi
  version: "2.0"
paths:
  /v1/cars:
    get:
      description: Returns cars registered in TeslaMate. Omit CarID to list all cars;
        include CarID for a single car.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: List TeslaMate cars or get one car
      tags:
      - V1
  /v1/cars/{CarID}:
    get:
      description: Returns cars registered in TeslaMate. Omit CarID to list all cars;
        include CarID for a single car.
      parameters:
      - description: Car ID (omit for list)
        in: path
        name: CarID
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: List TeslaMate cars or get one car
      tags:
      - V1
  /v1/cars/{CarID}/battery-health:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Get battery health for one car
      tags:
      - V1
  /v1/cars/{CarID}/charges:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Result page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 100)
        in: query
        name: show
        type: integer
      - description: Filter start date
        in: query
        name: startDate
        type: string
      - description: Filter end date
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: List charging sessions for one car
      tags:
      - V1
  /v1/cars/{CarID}/charges/{ChargeID}:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Charge ID
        in: path
        name: ChargeID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Get one charging session by ID
      tags:
      - V1
  /v1/cars/{CarID}/charges/current:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Get active charging session if any
      tags:
      - V1
  /v1/cars/{CarID}/command:
    get:
      description: GET returns enabled_commands. POST proxies to Tesla Owner API;
        response body follows Tesla API JSON. Also registered as POST /v1/cars/{CarID}/wake_up.
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Tesla vehicle commands (when ENABLE_COMMANDS is true)
      tags:
      - V1
  /v1/cars/{CarID}/command/{Command}:
    post:
      description: GET returns enabled_commands. POST proxies to Tesla Owner API;
        response body follows Tesla API JSON. Also registered as POST /v1/cars/{CarID}/wake_up.
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Remote command path segment (POST only)
        in: path
        name: Command
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Tesla vehicle commands (when ENABLE_COMMANDS is true)
      tags:
      - V1
  /v1/cars/{CarID}/commands:
    get:
      description: GET returns enabled_commands. POST proxies to Tesla Owner API;
        response body follows Tesla API JSON. Also registered as POST /v1/cars/{CarID}/wake_up.
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Tesla vehicle commands (when ENABLE_COMMANDS is true)
      tags:
      - V1
  /v1/cars/{CarID}/drives:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Result page
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: show
        type: integer
      - description: Filter start date
        in: query
        name: startDate
        type: string
      - description: Filter end date
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: List drives for one car
      tags:
      - V1
  /v1/cars/{CarID}/drives/{DriveID}:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Drive ID
        in: path
        name: DriveID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Get one drive by ID
      tags:
      - V1
  /v1/cars/{CarID}/logging:
    get:
      description: GET returns enabled_commands list; PUT forwards to TeslaMate logging
        API.
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: TeslaMate logging commands (when ENABLE_COMMANDS is true)
      tags:
      - V1
  /v1/cars/{CarID}/logging/{Command}:
    put:
      description: GET returns enabled_commands list; PUT forwards to TeslaMate logging
        API.
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Logging command (PUT)
        in: path
        name: Command
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: TeslaMate logging commands (when ENABLE_COMMANDS is true)
      tags:
      - V1
  /v1/cars/{CarID}/status:
    get:
      description: Requires MQTT; returns cached telemetry when available.
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: MQTT-backed live vehicle status
      tags:
      - V1
  /v1/cars/{CarID}/updates:
    get:
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: List firmware updates for one car
      tags:
      - V1
  /v1/cars/{CarID}/wake_up:
    post:
      description: GET returns enabled_commands. POST proxies to Tesla Owner API;
        response body follows Tesla API JSON. Also registered as POST /v1/cars/{CarID}/wake_up.
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Tesla vehicle commands (when ENABLE_COMMANDS is true)
      tags:
      - V1
  /v1/globalsettings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: Get TeslaMate global settings
      tags:
      - V1
  /v2:
    get:
      description: Returns the V2 analytics API version, scope, and currently advertised
        feature groups.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V2InfoAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/APIErrorResponse'
      summary: V2 API capability information
      tags:
      - V2 Summary
  /v2/cars/{CarID}/analytics/battery:
    get:
      description: Returns objective latest battery range samples, estimated full-range
        values, baseline range, and estimated range degradation. These estimates are
        not official state of health.
      parameters:
      - description: Car ID
        example: 1
        in: path
        name: CarID
        required: true
        type: integer
      - description: Aggregation period
        enum:
        - day
        - week
        - month
        - quarter
        - year
        - custom
        - lifetime
        in: query
        name: period
        type: string
      - description: Start datetime in RFC3339 format
        in: query
        name: start
        type: string
      - description: End datetime in RFC3339 format
        in: query
        name: end
        type: string
      - description: IANA timezone
        in: query
        name: timezone
        type: string
      - description: Comparison mode
        enum:
        - none
        - previous_period
        - previous_year
        - lifetime_average
        in: query
        name: compare
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V2BatteryAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/APIErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/APIErrorResponse'
      summary: V2 battery analytics summary
      tags:
      - V2 Battery Analytics
  /v2/cars/{CarID}/analytics/battery/distribution:
    get:
      description: Returns battery_level sample counts grouped into 10 percent buckets
        from 0-10 through 90-100.
      parameters:
      - description: Car ID
        example: 1
        in: path
        name: CarID
        required: true
        type: integer
      - description: Aggregation period
        enum:
        - day
        - week
        - month
        - quarter
        - year
        - custom
        - lifetime
        in: query
        name: period
        type: string
      - description: Start datetime in RFC3339 format
        in: query
        name: start
        type: string
      - description: End datetime in RFC3339 format
        in: query
        name: end
        type: string
      - description: IANA timezone
        in: query
        name: timezone
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V2BatteryDistributionAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/APIErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/APIErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/APIErrorResponse'
      summary: V2 battery level distribution
      tags:
      - V2 Battery Analytics
  /v2/cars/{CarID}/analytics/battery/timeseries:
    get:
      description: Returns estimated full rated and ideal range grouped by day, week,
        month, or year for trend charts.
      parameters:
      - description: Car ID
        example: 1
        in: path
        name: CarID
        required: true
        type: integer
      - description: Aggregation period
        enum:
        - day
        - week
        - month
        - quarter
        - year
        - custom
        - lifetime
        in: query
        name: period
        type: string
      - description: Start datetime in RFC3339 format
        in: query
        name: start
        type: string
      - description: End datetime in RFC3339 format
        in: query
        name: end
        type: string
      - description: IANA timezone
        in: query
        name: timezone
        type: string
      - description: Timeseries grouping
        enum:
        - day
