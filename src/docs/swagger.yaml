info:
  contact: {}
  description: 基于 TeslaMate 数据库的 REST API，提供车辆、充电、行程、统计、图表、时间线和洞察数据。原 TeslaMateApi
    兼容接口保持响应结构；扩展接口按当前项目最佳实践重新设计，可能包含破坏性变更。日期参数支持 RFC3339、带时区偏移、本地日期时间和纯日期；未带时区的本地日期使用环境变量配置的时区。
  title: TeslaMateApi
  version: "1.0"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.APISystemMessageResponse'
      summary: API 根路径
      tags:
      - 系统
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.APISystemMessageResponse'
      summary: 健康检查
      tags:
      - 系统
  /ping:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.APISystemMessageResponse'
      summary: 连通性检查
      tags:
      - 系统
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.APISystemMessageResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/main.APISystemErrorBody'
      summary: 就绪检查
      tags:
      - 系统
  /v1:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.APISystemMessageResponse'
      summary: API v1 根路径
      tags:
      - 系统
  /v1/cars:
    get:
      description: 兼容接口：使用历史响应封装返回全部车辆。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.CarsV1Envelope'
      summary: 车辆列表
      tags:
      - 兼容 API
  /v1/cars/{CarID}:
    get:
      description: 兼容接口：在 data.cars 中返回匹配车辆。
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.CarsV1Envelope'
      summary: 车辆详情
      tags:
      - 兼容 API
  /v1/cars/{CarID}/battery-health:
    get:
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.BatteryHealthV1Envelope'
      summary: 电池健康
      tags:
      - 兼容 API
  /v1/cars/{CarID}/charges:
    get:
      description: 兼容接口：保持历史充电列表响应封装。
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 开始时间
        in: query
        name: startDate
        type: string
      - description: 结束时间
        in: query
        name: endDate
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: show
        type: integer
      - description: 每页数量别名
        in: query
        name: limit
        type: integer
      - description: 偏移量别名
        in: query
        name: offset
        type: integer
      - description: 排序表达式
        in: query
        name: sort
        type: string
      - description: 逗号分隔的可选分区
        in: query
        name: include
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ChargesListV1Envelope'
      summary: 充电列表
      tags:
      - 兼容 API
  /v1/cars/{CarID}/charges/{ChargeID}:
    get:
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 充电 ID
        in: path
        name: ChargeID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ChargeDetailsV1Envelope'
      summary: 充电详情
      tags:
      - 兼容 API
  /v1/cars/{CarID}/charges/current:
    get:
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.CurrentChargeV1Envelope'
      summary: 当前充电
      tags:
      - 兼容 API
  /v1/cars/{CarID}/drives:
    get:
      description: 兼容接口：保持历史行程列表响应封装。
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 开始时间
        in: query
        name: startDate
        type: string
      - description: 结束时间
        in: query
        name: endDate
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: show
        type: integer
      - description: 每页数量别名
        in: query
        name: limit
        type: integer
      - description: 偏移量别名
        in: query
        name: offset
        type: integer
      - description: 排序表达式
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.DrivesListV1Envelope'
      summary: 行程列表
      tags:
      - 兼容 API
  /v1/cars/{CarID}/drives/{DriveID}:
    get:
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 行程 ID
        in: path
        name: DriveID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.DriveDetailsV1Envelope'
      summary: 行程详情
      tags:
      - 兼容 API
  /v1/cars/{CarID}/status:
    get:
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.CarStatusV1Envelope'
      summary: 当前车辆状态
      tags:
      - 兼容 API
  /v1/cars/{CarID}/updates:
    get:
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 开始时间
        in: query
        name: startDate
        type: string
      - description: 结束时间
        in: query
        name: endDate
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: show
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.UpdatesListV1Envelope'
      summary: 软件更新列表
      tags:
      - 兼容 API
  /v1/globalsettings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.GlobalsettingsV1Envelope'
      summary: 全局设置
      tags:
      - 兼容 API
  /v2:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.APISystemMessageResponse'
      summary: API v2 根路径
      tags:
      - 系统
  /v2/cars/{CarID}/activity:
    get:
      description: 扩展接口 v2：返回按日、周或月聚合的活动数据。
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: week|month|year|custom
        in: query
        name: period
        type: string
      - description: 自定义范围开始时间
        in: query
        name: startDate
        type: string
      - description: 自定义范围结束时间
        in: query
        name: endDate
        type: string
      - description: day|week|month
        in: query
        name: bucket
        type: string
      - description: 可选指标
        in: query
        name: metrics
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.ActivityV2Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
      summary: 活动日历
      tags:
      - 扩展 API
  /v2/cars/{CarID}/analysis/insights:
    get:
      description: 扩展接口 v2：返回所选周期的派生洞察卡片。
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: week|month|year|custom
        in: query
        name: period
        type: string
      - description: 自定义范围开始时间
        in: query
        name: startDate
        type: string
      - description: 自定义范围结束时间
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.InsightsV2Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
      summary: 分析洞察
      tags:
      - 扩展 API
  /v2/cars/{CarID}/analysis/records:
    get:
      description: 扩展接口 v2：返回全量或按年份过滤的个人最佳纪录。
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 可选年份过滤
        in: query
        name: year
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.RecordsV2Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
      summary: 分析纪录
      tags:
      - 扩展 API
  /v2/cars/{CarID}/analysis/trends:
    get:
      description: 扩展接口 v2：返回周期之间的指标趋势。
      parameters:
      - default: 1
        description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: week|month|year|custom
        in: query
        name: period
        type: string
      - description: 自定义范围开始时间
        in: query
        name: startDate
        type: string
      - description: 自定义范围结束时间
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.TrendsV2Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.v1ErrorEnvelope'
      summary: 分析趋势
      tags:
      - 扩展 API
