services:
  database:
    image: postgres:16-alpine
    container_name: teslamateapi-dev-db
    environment:
      POSTGRES_USER: teslamate
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: teslamate
    ports:
      - "55432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teslamate -d teslamate"]
      interval: 2s
      timeout: 2s
      retries: 30
