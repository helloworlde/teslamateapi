        type: number
      session_count:
        description: 充电会话数
        type: integer
      wall_energy:
        description: 墙端用电 (kWh)
        type: number
    type: object
  V2UpdateDrivingMetrics:
    properties:
      avg_consumption:
        description: 平均能耗 (Wh/km)
        type: number
      distance:
        description: 距离 (km)
        type: number
      duration:
        description: 时长 (秒)
        type: number
      net_energy:
        description: 净能量 (kWh)
        type: number
