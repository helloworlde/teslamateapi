      charging:
        allOf:
        - $ref: '#/definitions/V2UpdateChargingMetrics'
        description: 充电指标
      driving:
        allOf:
        - $ref: '#/definitions/V2UpdateDrivingMetrics'
        description: 行驶指标
      inactive_duration:
        description: 不活跃时长 (秒)
        type: number
    type: object
  V2VehicleSummary:
    properties:
      charge_efficiency:
        type: number
      odometer:
        type: number
      odometer_coverage:
        type: number
      odometer_total:
        type: number
      odometer_tracked:
        type: number
      rated_efficiency:
        type: number
      tracked_charges:
        type: integer
      tracked_consumption:
        type: number
      tracked_distance:
        type: number
      tracked_drives:
        type: integer
      tracked_wall:
        type: number
    type: object
info:
  contact: {}
  description: TeslaMate 数据查询与分析 API。提供 V1（原始数据）和 V2（聚合分析）两套接口。
  title: TeslaMateApi
  version: "2.0"
paths:
  /:
    get:
      description: 返回服务运行状态与 API 基础路径，用于快速联通性检查。
      produces:
      - application/json
      responses:
        "200":
          description: 服务运行中
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 服务根路径
      tags:
      - system
  /api:
    get:
      description: 返回服务运行状态与 /api 基础路径。
      produces:
      - application/json
      responses:
        "200":
          description: 服务运行中
          schema:
            additionalProperties:
              type: string
            type: object
      summary: /api 根路径
      tags:
      - system
  /healthz:
    get:
      description: Kubernetes liveness 探针，进程存活则返回 200。
      produces:
      - application/json
      responses:
        "200":
          description: 服务存活
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 存活探针
      tags:
      - system
  /ping:
    get:
      description: 简单的 ping/pong 探活接口，用于网络层连通性检测。
      produces:
      - application/json
      responses:
        "200":
          description: pong
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Ping 探活
      tags:
      - system
  /readyz:
    get:
      description: Kubernetes readiness 探针，数据库连接建立后返回 200，否则 503。
      produces:
      - application/json
      responses:
        "200":
          description: 服务就绪
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: 尚未就绪
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 就绪探针
      tags:
      - system
  /v1:
    get:
      description: 返回 V1 接口运行状态与基础路径。
      produces:
      - application/json
      responses:
        "200":
          description: V1 接口运行中
          schema:
            additionalProperties:
              type: string
            type: object
      summary: /api/v1 根路径
      tags:
      - system
  /v1/cars:
    get:
      description: 返回 TeslaMate 中登记的车辆。省略 CarID 返回全部车辆，传入 CarID 返回指定车辆。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 车辆列表或单车详情
      tags:
      - v1
  /v1/cars/{CarID}:
    get:
      description: 返回 TeslaMate 中登记的车辆。省略 CarID 返回全部车辆，传入 CarID 返回指定车辆。
      parameters:
      - description: 车辆 ID（不传则返回全部车辆）
        in: path
        name: CarID
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 车辆列表或单车详情
      tags:
      - v1
  /v1/cars/{CarID}/battery-health:
    get:
      parameters:
      - description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 获取车辆电池健康度
      tags:
      - v1
  /v1/cars/{CarID}/charges:
    get:
      parameters:
      - description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 结果页码（默认 1）
        in: query
        name: page
        type: integer
      - description: 每页大小（默认 100）
        in: query
        name: show
        type: integer
      - description: 筛选起始日期
        in: query
        name: startDate
        type: string
      - description: 筛选结束日期
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 车辆充电会话列表
      tags:
      - v1
  /v1/cars/{CarID}/charges/{ChargeID}:
    get:
      parameters:
      - description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 充电会话 ID
        in: path
        name: ChargeID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 单条充电会话详情
      tags:
      - v1
  /v1/cars/{CarID}/charges/current:
    get:
      parameters:
      - description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 当前进行中的充电会话
      tags:
      - v1
  /v1/cars/{CarID}/drives:
    get:
      parameters:
      - description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 结果页码
        in: query
        name: page
        type: integer
      - description: 每页大小
        in: query
        name: show
        type: integer
      - description: 筛选起始日期
        in: query
        name: startDate
        type: string
      - description: 筛选结束日期
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 车辆行程列表
      tags:
      - v1
  /v1/cars/{CarID}/drives/{DriveID}:
    get:
      parameters:
      - description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 行程 ID
        in: path
        name: DriveID
        required: true
        type: integer
      - description: 行程明细下采样：full、every_5s（默认）、every_30s
        enum:
        - full
        - every_5s
        - every_30s
        in: query
        name: sample
        type: string
      - description: 设为 false 可在响应中省略 drive_details（行程轨迹）
        in: query
        name: include_route
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 单条行程详情
      tags:
      - v1
  /v1/cars/{CarID}/status:
    get:
      description: 基于 MQTT 推送的实时车辆遥测；需启用 MQTT，未启用时返回 501。
      parameters:
      - description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 车辆实时状态（MQTT）
      tags:
      - v1
  /v1/cars/{CarID}/tire-pressure:
    get:
      description: 最近一次 TPMS 读数 + 时间窗内极值 + 按天历史。气压单位遵循 settings.unit_of_pressure（默认
        bar；psi 由 BarToPsi 换算）。
      parameters:
      - description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: 历史窗口天数（默认 30，最大 365）
        in: query
        name: window_days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 车辆胎压（最近读数 + 窗口）
      tags:
      - v1
  /v1/cars/{CarID}/updates:
    get:
      parameters:
      - description: 车辆 ID
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: 车辆 OTA 更新历史
      tags:
      - v1
  /v1/globalsettings:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V1ErrorEnvelope'
      summary: TeslaMate 全局设置
      tags:
      - v1
  /v2/capabilities:
    get:
      description: 返回 V2 分析接口版本、各子域能力开关（compare/timeseries/breakdown）、各子域允许的 breakdown
        取值。客户端据此决定查询参数，免去逐个接口探测。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/V2CapabilitiesAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/APIErrorResponse'
