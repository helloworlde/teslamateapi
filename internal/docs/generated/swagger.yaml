  V2Unit:
    properties:
      consumption:
        example: Wh/km
        type: string
      currency:
        example: CNY
        type: string
      distance:
        description: 距离 (km)
        example: km
        type: string
      duration:
        description: 时长 (秒)
        example: seconds
        type: string
      elevation:
        example: m
        type: string
      energy:
        example: kWh
        type: string
      power:
        example: kW
