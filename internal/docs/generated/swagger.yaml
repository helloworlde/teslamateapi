        type: integer
      duration:
        description: 时长 (秒)
        type: number
      started_at:
        description: 开始时间
        type: string
      version:
        description: 版本
        type: string
    type: object
  V2UpdateSummary:
    properties:
      latest_version:
        description: 最近版本
        type: string
      update_count:
        description: OTA 更新次数
