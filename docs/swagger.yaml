basePath: /
definitions:
  dto.Car:
    properties:
      car_id:
        example: 1
        type: integer
      car_name:
        example: Blue Thunder
        type: string
    type: object
  dto.ErrorEnvelope:
    properties:
      error:
        example: Unable to load cars.
        type: string
    type: object
  dto.HealthResponse:
    properties:
      status:
        example: OK
        type: string
    type: object
  dto.MessageEnvelope:
    properties:
      message:
        example: TeslaMateApi container running..
        type: string
      path:
        example: /api
        type: string
    type: object
  dto.NotFoundResponse:
    properties:
      code:
        example: PAGE_NOT_FOUND
        type: string
      message:
        example: Page not found
        type: string
    type: object
  dto.Pagination:
    properties:
      has_next:
        example: false
        type: boolean
      page:
        example: 1
        type: integer
      show:
        example: 100
        type: integer
      total_count:
        example: 382
        type: integer
    type: object
  dto.PongResponse:
    properties:
      message:
        example: pong
        type: string
    type: object
  dto.ReadyResponse:
    properties:
      status:
        example: OK
        type: string
    type: object
  dto.TeslaMateUnits:
    properties:
      unit_of_length:
        enum:
        - km
        - mi
        example: km
        type: string
      unit_of_temperature:
        enum:
        - C
        - F
        example: C
        type: string
    type: object
  dto.TeslaMateUnitsWithPressure:
    properties:
      unit_of_length:
        enum:
        - km
        - mi
        example: km
        type: string
      unit_of_pressure:
        enum:
        - bar
        - psi
        example: bar
        type: string
      unit_of_temperature:
        enum:
        - C
        - F
        example: C
        type: string
    type: object
  dto.V1BatteryHealth:
    properties:
      battery_health_percentage:
        example: 96.24
        type: number
      current_battery_level:
        description: |-
          CurrentBatteryLevel is the most recent usable state-of-charge (%), and
          PredictedRange is the range actually drivable at that level
          (current_range × level / 100). Both are objective readings, not estimates.
        example: 62
        type: number
      current_capacity:
        example: 79.4
        type: number
      current_range:
        example: 432.7
        type: number
      max_capacity:
        example: 82.5
        type: number
      max_range:
        example: 450.2
        type: number
      predicted_range:
        example: 268.3
        type: number
      rated_efficiency:
        example: 18.4
        type: number
    type: object
  dto.V1BatteryHealthData:
