info:
  contact: {}
  description: REST API in front of TeslaMate's Postgres database, the MQTT status
    feed, and (optionally) Tesla owner-api / TeslaMate logging command relays.
  title: TeslaMateApi
  version: "1.0"
paths:
  /:
    get:
      description: Returns a small banner confirming the API process is running.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageEnvelope'
      summary: Root banner
      tags:
      - system
  /api/:
    get:
      description: Banner for the /api root.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageEnvelope'
      summary: /api banner
      tags:
      - system
  /api/docs:
    get:
      description: Renders the Scalar API reference UI. No auth required.
      produces:
      - text/html
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: API reference (HTML)
      tags:
      - system
  /api/healthz:
    get:
      description: Returns 200 as long as the process is up. No auth required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Liveness probe
      tags:
      - system
  /api/openapi.yaml:
    get:
      description: Returns the embedded OpenAPI 3.x spec. No auth required.
      produces:
      - application/yaml
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: OpenAPI spec (YAML)
      tags:
      - system
  /api/ping:
    get:
      description: Returns {"message":"pong"} for simple uptime checks. No auth required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PongResponse'
      summary: Ping
      tags:
      - system
  /api/readyz:
    get:
      description: Returns 200 when MQTT is connected (or DISABLE_MQTT=true). 503
        otherwise. No auth required.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      summary: Readiness probe
      tags:
      - system
  /api/v1/:
    get:
      description: Banner for the /api/v1 root.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MessageEnvelope'
      security:
      - BearerAuth: []
      summary: /api/v1 banner
      tags:
      - system
  /api/v1/cars:
    get:
      description: Returns every car TeslaMate tracks (with details / exterior / settings
        / stats).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.V1CarsResponse'
        "401":
          description: missing/invalid bearer token
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List cars
      tags:
      - v1
  /api/v1/cars/{CarID}:
    get:
      description: Returns every car TeslaMate tracks (with details / exterior / settings
        / stats).
      parameters:
      - description: TeslaMate cars.id; omit for all cars
        in: path
        name: CarID
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.V1CarsResponse'
        "401":
          description: missing/invalid bearer token
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List cars
      tags:
      - v1
  /api/v1/cars/{CarID}/battery-health:
    get:
      description: Returns max/current range and capacity along with a derived health
        %.
      parameters:
      - description: TeslaMate cars.id
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.V1BatteryHealthResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Battery health
      tags:
      - v1
  /api/v1/cars/{CarID}/charges:
    get:
      description: Returns charging sessions with charger-shape aggregates.
      parameters:
      - description: TeslaMate cars.id
        in: path
        name: CarID
        required: true
        type: integer
      - default: 1
        description: 1-indexed page
        in: query
        name: page
        type: integer
      - default: 100
        description: page size
        in: query
        name: show
        type: integer
      - description: RFC3339 lower bound
        in: query
        name: startDate
        type: string
      - description: RFC3339 upper bound
        in: query
        name: endDate
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.V1ChargesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List charging sessions
      tags:
      - v1
  /api/v1/cars/{CarID}/charges/{ChargeID}:
    get:
      description: Returns one charge session with charge samples. Use sample/include_details
        query parameters to control detail density.
      parameters:
      - description: TeslaMate cars.id
        in: path
        name: CarID
        required: true
        type: integer
      - description: charging_processes.id
        in: path
        name: ChargeID
        required: true
        type: integer
      - description: 充电明细下采样：auto（默认）、full、every_5s、every_30s
        enum:
        - auto
        - full
        - every_5s
        - every_30s
        in: query
        name: sample
        type: string
      - description: auto 模式目标返回的明细点数，范围 100-3000，默认 800；状态变化点会强制保留
        in: query
        name: max_points
        type: integer
      - description: 设为 false 可在响应中省略 charge_details
        in: query
        name: include_details
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.V1ChargeDetailResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Charge details
      tags:
      - v1
  /api/v1/cars/{CarID}/charges/current:
    get:
      description: Returns the active charge and per-sample telemetry, when present.
      parameters:
      - description: TeslaMate cars.id
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.V1ChargesCurrentResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: Current charge
      tags:
      - v1
  /api/v1/cars/{CarID}/command:
    get:
      description: Returns the allow-list. Requires ENABLE_COMMANDS=true.
      parameters:
      - description: TeslaMate cars.id
        in: path
        name: CarID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.V1CommandList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
        "403":
          description: ENABLE_COMMANDS=false
          schema:
            $ref: '#/definitions/dto.ErrorEnvelope'
      security:
      - BearerAuth: []
      summary: List Tesla commands
      tags:
      - v1
  /api/v1/cars/{CarID}/command/{Command}:
    post:
      consumes:
      - application/json
      description: Proxies to Tesla owner-api with the car's stored token. Status
        code and body mirror Tesla's. Requires ENABLE_COMMANDS=true.
      parameters:
      - description: TeslaMate cars.id
        in: path
        name: CarID
        required: true
        type: integer
      - description: Command name
        in: path
        name: Command
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Tesla passthrough JSON
          schema:
