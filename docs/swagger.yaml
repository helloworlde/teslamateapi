    get:
      description: Returns one drive with position samples. Use sample/include_route
        query parameters to control detail density.
      parameters:
      - description: TeslaMate cars.id
        in: path
        name: CarID
        required: true
        type: integer
      - description: drives.id
        in: path
        name: DriveID
        required: true
        type: integer
      - description: 行程明细下采样：auto（默认）、full、every_5s、every_30s
        enum:
        - auto
        - full
        - every_5s
        - every_30s
        in: query
        name: sample
        type: string
      - description: auto 模式目标返回的明细点数，范围 100-3000，默认 800；状态变化点和路线边界点会强制保留
        in: query
        name: max_points
        type: integer
      - description: 设为 false 可在响应中省略 drive_details（行程轨迹）
        in: query
        name: include_route
        type: boolean
