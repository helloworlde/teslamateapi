info:
  contact: {}
  description: REST API for TeslaMate data, including V1 resources and V2 objective
    analytics.
  title: TeslaMateApi
  version: "2.0"
paths:
  /v2:
    get:
      description: Returns the V2 analytics API version, scope, and currently advertised
        feature groups.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.V2InfoAPIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.APIErrorResponse'
      summary: V2 API capability information
      tags:
      - V2 Summary
  /v2/cars/{CarID}/analytics/battery:
    get:
      description: Returns objective latest battery range samples, estimated full-range
        values, baseline range, and estimated range degradation. These estimates are
        not official state of health.
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Aggregation period
        enum:
        - day
        - week
        - month
        - quarter
        - year
        - custom
        - lifetime
        in: query
        name: period
        type: string
      - description: Start datetime in RFC3339 format
        in: query
        name: start
        type: string
      - description: End datetime in RFC3339 format
        in: query
        name: end
        type: string
      - description: IANA timezone
        in: query
        name: timezone
        type: string
      - description: Comparison mode
        enum:
        - none
        - previous_period
        - previous_year
        - lifetime_average
        in: query
        name: compare
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.V2BatteryAPIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/main.APIErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/main.APIErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.APIErrorResponse'
      summary: V2 battery analytics summary
      tags:
      - V2 Battery Analytics
  /v2/cars/{CarID}/analytics/battery/distribution:
    get:
      description: Returns battery_level sample counts grouped into 10 percent buckets
        from 0-10 through 90-100.
      parameters:
      - description: Car ID
        in: path
        name: CarID
        required: true
        type: integer
      - description: Aggregation period
        enum:
        - day
        - week
        - month
        - quarter
        - year
        - custom
        - lifetime
        in: query
        name: period
        type: string
      - description: Start datetime in RFC3339 format
        in: query
        name: start
        type: string
      - description: End datetime in RFC3339 format
        in: query
        name: end
        type: string
      - description: IANA timezone
        in: query
        name: timezone
        type: string
      produces:
