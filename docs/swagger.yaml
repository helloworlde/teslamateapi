securityDefinitions:
  BearerAuth:
    description: API_TOKEN bearer credential. Required for every /api/* route except
      /api, /api/, /api/ping, /api/healthz, /api/readyz, /api/docs, /api/openapi.yaml.
    in: header
    name: Authorization
    type: apiKey
