name: tests

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'docs/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/test-geofence-integration.sh'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'docs/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/test-geofence-integration.sh'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL server tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16
      - name: Unit tests and vet
        run: |
          go vet ./...
          go test -race ./...
      - name: PostgreSQL integration tests
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: make test-integration TEST_INTEGRATION_FLAGS=-race
