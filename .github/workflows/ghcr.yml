name: publish ghcr

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - ".github/workflows/ghcr.yml"
      - "Dockerfile"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: prepare metadata
    runs-on: self-hosted

    outputs:
      image_name: ${{ steps.image.outputs.name }}
      docker_meta_json: ${{ steps.docker_meta.outputs.json }}
      docker_meta_labels: ${{ steps.docker_meta.outputs.labels }}

    steps:
      - name: Image name (lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: |
            ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch

  build:
    name: build (${{ matrix.platform }})
    runs-on: self-hosted
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
          - platform: linux/arm64
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Go caches
        id: go_cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            go-mod-cache
            go-build-cache
          key: go-cache-${{ matrix.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-cache-${{ matrix.arch }}-

      - name: Inject Go caches into buildx
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "go-mod-cache": "/go/pkg/mod",
              "go-build-cache": "/root/.cache/go-build"
            }
          skip-extraction: ${{ steps.go_cache.outputs.cache-hit }}

      - name: Build and push (${{ matrix.platform }})
        id: docker_build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          tags: ${{ needs.prepare.outputs.image_name }}
          labels: ${{ needs.prepare.outputs.docker_meta_labels }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ghcr-${{ matrix.platform }}
          cache-to: type=gha,scope=ghcr-${{ matrix.platform }},mode=max
          build-args: |
            apiVersion=${{ fromJSON(needs.prepare.outputs.docker_meta_json).labels['org.opencontainers.image.version'] }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.docker_build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: manifest (multi-arch)
    runs-on: self-hosted
    needs:
      - prepare
      - build

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image_name }}
          DOCKER_META_JSON: ${{ needs.prepare.outputs.docker_meta_json }}
        run: |
          set -euo pipefail

          mapfile -t TAGS < <(jq -r '.tags[]' <<< "$DOCKER_META_JSON")
          mapfile -t DIGESTS < <(find . -maxdepth 1 -type f -print | sed 's|^\./||' | grep -E '^[a-f0-9]{64}$' || true)

          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No tags found in DOCKER_META_JSON"
            exit 1
          fi

          if [ "${#DIGESTS[@]}" -eq 0 ]; then
            echo "No digest files found in $PWD"
            exit 1
          fi

          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do
            TAG_ARGS+=("-t" "$tag")
          done

          SRC_ARGS=()
          for digest in "${DIGESTS[@]}"; do
            SRC_ARGS+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${SRC_ARGS[@]}"
